[project]
name = "citable-publication"
version = "0.1.0"
description = "Deterministic HTML, Markdown, and JSON publication integrity"
requires-python = ">=3.13"
license = "MIT"
readme = "README.md"
dependencies = []

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["citable_publication"]

[tool.coverage.report]
show_missing = true
fail_under = 90
